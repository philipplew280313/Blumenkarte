<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Blumenkarte</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blumenkarte">
<meta name="theme-color" content="#14130f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
:root{
  --ink:#f6f1e7; --ink-2:#c9c1b2; --ink-3:#8f8778;
  --glass:rgba(22,21,17,.72); --glass-strong:rgba(22,21,17,.92);
  --line:rgba(255,248,235,.14);
  --accent:#d24b86; --accent-ink:#fff;
  --leaf:#7fae5a;
  --me:#2f8cff;
  --sheet:#1b1a16; --field:#26241f;
  --r:18px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#14130f;color:var(--ink);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--ink)}
#map{position:fixed;inset:0;background:#2a2822}
.leaflet-container{background:#2a2822;font:inherit}
.leaflet-control-attribution{background:rgba(20,19,15,.55)!important;color:#ddd!important;font-size:9px!important;border-radius:6px 0 0 0}
.leaflet-control-attribution a{color:#eee!important}
.leaflet-bottom.leaflet-right{margin-bottom:calc(var(--sab) + 92px)}
.leaflet-bottom.leaflet-left{margin-bottom:calc(var(--sab) + 96px)}
.leaflet-control-scale-line{background:rgba(20,19,15,.55);color:#fff;border-color:#fff;font-size:10px;text-shadow:none}

/* ---------- glass controls ---------- */
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.35)}
#topbar{position:fixed;left:0;right:0;top:calc(var(--sat) + 10px);display:flex;justify-content:center;pointer-events:none;z-index:500}
.seg{pointer-events:auto;display:flex;padding:3px;border-radius:14px;gap:2px}
.seg button{padding:8px 14px;border-radius:11px;font-size:15px;font-weight:600;color:var(--ink-2);letter-spacing:.1px;transition:background .2s,color .2s}
.seg button.on{background:var(--ink);color:#16150f}
#sidebtns{position:fixed;right:12px;top:calc(var(--sat) + 64px);display:flex;flex-direction:column;border-radius:14px;overflow:hidden;z-index:500}
#sidebtns button{width:46px;height:46px;display:grid;place-items:center}
#sidebtns button+button{border-top:1px solid var(--line)}
#sidebtns svg{width:22px;height:22px}
#btnLocate.follow svg{color:var(--me)}
#offlineBadge{position:fixed;left:12px;top:calc(var(--sat) + 64px);z-index:500;font-size:12px;font-weight:600;padding:6px 10px;border-radius:10px;display:none}
#offlineBadge.show{display:block}

#bottombar{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 16px);display:flex;align-items:center;justify-content:center;gap:28px;z-index:500;pointer-events:none}
#bottombar>*{pointer-events:auto}
.round{width:54px;height:54px;border-radius:50%;display:grid;place-items:center}
.round svg{width:24px;height:24px}
#btnShoot{width:76px;height:76px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 0 0 4px rgba(255,255,255,.9),0 10px 30px rgba(0,0,0,.45);transition:transform .12s}
#btnShoot:active{transform:scale(.93)}
#btnShoot svg{width:34px;height:34px}
.badge{position:absolute;transform:translate(16px,-16px);min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--leaf);color:#0f1a08;font-size:12px;font-weight:700;display:grid;place-items:center}
#btnList{position:relative}

/* ---------- map markers ---------- */
.ph-wrap{background:none;border:0}
.ph{position:relative;width:52px;height:52px;border-radius:12px;background:#fff;padding:3px;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.ph::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:9px;display:block}
.ph .cnt{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
.me-wrap{background:none;border:0}
.me{width:20px;height:20px;border-radius:50%;background:var(--me);border:3px solid #fff;box-shadow:0 0 0 0 rgba(47,140,255,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,140,255,.55)}70%{box-shadow:0 0 0 14px rgba(47,140,255,0)}100%{box-shadow:0 0 0 0 rgba(47,140,255,0)}}

/* ---------- place mode ---------- */
#pin{position:fixed;left:50%;top:50%;z-index:600;transform:translate(-50%,-100%);display:none;pointer-events:none}
#pin svg{width:44px;height:44px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
#pinbar{position:fixed;left:12px;right:12px;bottom:calc(var(--sab) + 16px);z-index:650;border-radius:var(--r);padding:14px;display:none}
#pinbar p{margin:0 0 12px;font-size:14px;color:var(--ink-2);text-align:center}
body.placing #pin,body.placing #pinbar{display:block}
body.placing #bottombar,body.placing #sidebtns .hide-placing{display:none}

/* ---------- Zeichenmodus ---------- */
#drawbar{position:fixed;left:12px;right:12px;bottom:calc(var(--sab) + 16px);z-index:650;border-radius:var(--r);padding:10px 12px 12px;display:none}
body.drawing #drawbar{display:block}
body.drawing #bottombar,body.drawing #sidebtns .hide-drawing{display:none}
body.drawing .leaflet-bottom.leaflet-right,body.drawing .leaflet-bottom.leaflet-left{margin-bottom:calc(var(--sab) + 190px)}
.dtools{display:flex;align-items:stretch;gap:6px}
.dtools button{flex:1;min-width:0;border-radius:12px;background:#2e2b25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:7px 2px 6px;color:var(--ink-2)}
.dtools button svg{width:22px;height:22px}
.dtools button small{font-size:11px;font-weight:600}
.dtools button i{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.85)}
.dtools button.on{background:var(--ink);color:#16150f}
.dtools button[data-color].on i{box-shadow:0 0 0 3px #16150f}
.dsep{width:1px;background:var(--line);margin:4px 2px}
body.draw-line #map,body.draw-line #map *{touch-action:none!important}
#drawHint{margin:9px 2px 10px;font-size:13px;line-height:1.4;color:var(--ink-2);min-height:36px}

/* ---------- sheet ---------- */
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:800;opacity:0;pointer-events:none;transition:opacity .25s}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:801;max-height:calc(100% - var(--sat) - 30px);background:var(--sheet);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;border-top:1px solid var(--line)}
body.sheet-open #backdrop{opacity:1;pointer-events:auto}
body.sheet-open #sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:#55514a;margin:8px auto 2px;flex:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px;flex:none}
.sh-head h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.2px}
.sh-x{width:32px;height:32px;border-radius:50%;background:#2e2b25;display:grid;place-items:center;color:var(--ink-2)}
.sh-x svg{width:16px;height:16px}
.sh-body{overflow:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(var(--sab) + 20px)}
.photo-big{width:100%;max-height:52vh;object-fit:cover;border-radius:14px;display:block;background:#000}
.field{display:block;margin-top:14px}
.field span{display:block;font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.6px;margin:0 0 6px 2px}
.field input,.field textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;outline:none}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;height:50px;border-radius:14px;background:#2e2b25;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{color:#ff6b6b}
.btn:disabled{opacity:.45}
.posline{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px;border-radius:12px;background:var(--field);font-size:14px;color:var(--ink-2)}
.posline svg{width:18px;height:18px;flex:none;color:var(--accent)}
.posline .grow{flex:1}
.posline button{color:var(--accent);font-weight:600}
.meta{color:var(--ink-3);font-size:13px;margin-top:10px;line-height:1.5}
.note{white-space:pre-wrap;line-height:1.45;font-size:16px;margin-top:10px}
.title{font-size:22px;font-weight:700;margin:14px 0 0;letter-spacing:-.3px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:10px;border-radius:12px;overflow:hidden}
.grid button{position:relative;aspect-ratio:1;background:#000}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;font-size:11px;font-weight:600;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.75));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{width:100%;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;outline:none}
.empty{text-align:center;color:var(--ink-3);padding:40px 10px;line-height:1.5}

.list{margin-top:6px;border-radius:14px;background:var(--field);overflow:hidden}
.list>button,.list>label,.list>div{display:flex;align-items:center;gap:12px;width:100%;padding:14px;text-align:left;font-size:16px}
.list>*+*{border-top:1px solid var(--line)}
.list svg{width:22px;height:22px;flex:none;color:var(--accent)}
.list .sub{display:block;font-size:13px;color:var(--ink-3);margin-top:2px}
.list .grow{flex:1;min-width:0}
.list input[type=radio],.list input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.sec{font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.6px;margin:20px 0 6px 4px}
.hint{font-size:13px;color:var(--ink-3);line-height:1.5;margin:8px 4px 0}
.range{width:100%;accent-color:var(--accent)}
.est{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2);margin-top:8px}
.prog{height:8px;border-radius:4px;background:#2e2b25;overflow:hidden;margin-top:14px}
.prog i{display:block;height:100%;width:0;background:var(--leaf);transition:width .2s}

#viewer{position:fixed;inset:0;background:#000;z-index:900;display:none}
#viewer.show{display:block}
#viewer img{width:100%;height:100%;object-fit:contain}
#viewer button{position:absolute;top:calc(var(--sat) + 10px);right:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
#viewer svg{width:18px;height:18px}

#toast{position:fixed;left:50%;top:calc(var(--sat) + 60px);transform:translate(-50%,-20px);opacity:0;z-index:1000;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;transition:opacity .25s,transform .25s;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="map"></div>

<div id="topbar">
  <div class="seg glass" id="seg">
    <button data-layer="dop" class="on">Luftbild</button>
    <button data-layer="h53">1953</button>
    <button data-layer="dgm">Gelände</button>
  </div>
</div>

<div id="offlineBadge" class="glass">Offline</div>

<div id="sidebtns" class="glass">
  <button id="btnLayers" class="hide-placing" aria-label="Kartenebenen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3 2.5 8 12 13l9.5-5L12 3Z"/><path d="m2.5 12.5 9.5 5 9.5-5"/><path d="m2.5 16.5 9.5 5 9.5-5" opacity=".5"/></svg></button>
  <button id="btnDraw" class="hide-placing hide-drawing" aria-label="Gräben zeichnen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l3-4 3 3 3-6 3 4 3-3 3 2"/><path d="M3 21h18" opacity=".45"/></svg></button>
  <button id="btnLocate" aria-label="Mein Standort"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.4 2.6c.4.4.5.9.3 1.4l-7.5 17.3c-.4.9-1.7.8-1.9-.1l-1.7-6.8-6.8-1.7c-.9-.2-1-1.5-.1-1.9L21 3.3c.1 0 .3-.1.4-.1z" transform="translate(-1 1)"/></svg></button>
</div>

<div id="bottombar">
  <button id="btnList" class="round glass" aria-label="Alle Blumen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg><span class="badge" id="count" hidden>0</span></button>
  <button id="btnShoot" aria-label="Foto aufnehmen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.3l1.4-2h5.6l1.4 2h1.3A2.5 2.5 0 0 1 20 8.5v9A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5z"/><circle cx="12" cy="12.5" r="3.6"/></svg></button>
  <button id="btnMenu" class="round glass" aria-label="Menü" style="position:relative"><span id="menuDot" hidden style="position:absolute;top:2px;right:2px;width:13px;height:13px;border-radius:50%;background:#ff9f3b;border:2px solid #14130f"></span><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
</div>

<div id="pin"><svg viewBox="0 0 24 24"><path fill="#d24b86" stroke="#fff" stroke-width="1.5" d="M12 22s7-6.4 7-12A7 7 0 0 0 5 10c0 5.6 7 12 7 12Z"/><circle cx="12" cy="10" r="2.6" fill="#fff"/></svg></div>
<div id="pinbar" class="glass">
  <p>Karte verschieben, bis die Nadel auf der Blume steht</p>
  <div class="row" style="margin:0">
    <button class="btn" id="pinCancel">Abbrechen</button>
    <button class="btn" id="pinMe">Mein Standort</button>
    <button class="btn primary" id="pinOk">Hier</button>
  </div>
</div>

<div id="drawbar" class="glass">
  <div class="dtools">
    <button data-tool="move" aria-label="Bewegen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M12 3 9.5 5.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5"/></svg><small>Bewegen</small></button>
    <button data-tool="line" aria-label="Graben zeichnen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16l3.5-5 3.5 4 3.5-7 3.5 5L21 9"/></svg><small>Graben</small></button>
    <button data-tool="point" aria-label="Stellung setzen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.5" fill="currentColor"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".5"/></svg><small>Stellung</small></button>
    <span class="dsep"></span>
    <button data-color="red" aria-label="Rot"><i style="background:#ff2b2b"></i><small>Rot</small></button>
    <button data-color="blue" aria-label="Blau"><i style="background:#2a7bff"></i><small>Blau</small></button>
  </div>
  <p id="drawHint"></p>
  <div class="row" style="margin:0"><button class="btn" id="drawUndo">Rückgängig</button><button class="btn primary" id="drawDone">Fertig</button></div>
</div>

<div id="backdrop"></div>
<div id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="sh-head"><h2 id="shTitle"></h2><button class="sh-x" id="shClose" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="sh-body" id="shBody"></div>
</div>

<div id="viewer"><img alt=""><button aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
<div id="toast" class="glass"></div>

<input type="file" id="inCamera" class="hidden-input" accept="image/*" capture="environment">
<input type="file" id="inGallery" class="hidden-input" accept="image/*" multiple>
<input type="file" id="inBackup" class="hidden-input" accept=".zip,application/zip" multiple>
<input type="file" id="inShapes" class="hidden-input" accept=".geojson,.json,application/geo+json,application/json">
<datalist id="arten"></datalist>

<script src="vendor/leaflet.js"></script>
<script src="app.js"></script>
<script src="draw.js"></script>
</body>
</html>
